<div class="comentario-form">
  <h3>{{ nombreProducto ? 'Valorar: ' + nombreProducto : 'Escribir comentario' }}</h3>

  <form [formGroup]="form" (ngSubmit)="enviar()">

    <label>Valoración</label>
    <select formControlName="valoracion">
      <option *ngFor="let n of [1,2,3,4,5]" [value]="n">
        {{n}} ⭐
      </option>
    </select>

    <label>Comentario</label>
    <textarea formControlName="texto" placeholder="Cuéntanos tu experiencia con este producto..."></textarea>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button type="submit" style="flex: 1;">Enviar</button>
      <button type="button" (click)="cerrar()" style="flex: 1; background-color: #ccc;">Cancelar</button>
    </div>
  </form>
</div>
