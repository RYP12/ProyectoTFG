<div class="restablecer-container">
  <h2>Restablecer Contraseña</h2>

  @if (tokenValido) {
    <div>
      <form (ngSubmit)="cambiarPassword()">
        <div class="form-group">
          <label>Nueva Contraseña</label>
          <input type="password" [(ngModel)]="password1" name="pass1" required>
        </div>
        <div class="form-group">
          <label>Repetir Nueva Contraseña</label>
          <input type="password" [(ngModel)]="password2" name="pass2" required>
        </div>

        @if (errorMsg) {
          <p class="error-msg">{{ errorMsg }}</p>
        }

        <button type="submit">Cambiar Contraseña</button>
      </form>
    </div>
  } @else {
    <p>No se proporcionó un token válido.</p>
  }

</div>
