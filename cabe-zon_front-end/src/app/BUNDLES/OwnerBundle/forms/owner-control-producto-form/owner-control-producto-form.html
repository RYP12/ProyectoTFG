<div id="background">

  <div id="titulo">
    <h1>{{ modoEdicion() ? 'EDITAR' : 'AÑADIR' }}</h1>
  </div>

  <div class="panel-externo">

    <div id="formularioPrincipal">

      <form [formGroup]="productoForm" (ngSubmit)="procesarProducto()">

        <div id="primeraParteForm">
          <img src="/ASSETS/IMAGES/Vector.png" alt="">
          <h3>{{ modoEdicion() ? 'Editar producto' : 'Añadir un producto' }}</h3>
        </div>

        <div>
          <h3>Nombre:</h3>
          <input type="text" formControlName="nombre">
        </div>

        <div id="terceraParteForm">

          <div class="tamanyoTerceraParteForm">
            <h3>Nº Colección</h3>
            <input type="text" formControlName="codigoProducto">
          </div>

          <div class="tamanyoTerceraParteForm">
            <h3>Stock</h3>
            <input type="number" formControlName="stock">
          </div>

          <div class="tamanyoTerceraParteForm">
            <h3>Precio (€)</h3>
            <input type="number" step="0.01" formControlName="precio">
          </div>

          <div class="tamanyoTerceraParteForm">
            <h3>Descripción</h3>
            <textarea formControlName="descripcion"></textarea>
          </div>

          <div class="tamanyoTerceraParteForm">
            <h3>Exclusivo</h3>
            <label class="switch">
              <input type="checkbox" formControlName="exclusivo">
              <span class="slider"></span>
            </label>
          </div>

        </div>

        <div>
          <h3>Imágenes:</h3>

          <div id="cuartaParteForm">

            <div class="imagenInput">
              <label>Imagen Principal</label>
              <input type="file" (change)="onFileSelected($event, 0)" accept="image/*">
            </div>

            <div class="imagenInput">
              <label>Imagen Lateral</label>
              <input type="file" (change)="onFileSelected($event, 1)" accept="image/*">
            </div>

            <div class="imagenInput">
              <label>Imagen Detalle</label>
              <input type="file" (change)="onFileSelected($event, 2)" accept="image/*">
            </div>

            <div id="colaboracion">
              <h3>Colaboración</h3>

              <select formControlName="coleccionId">
                <option [ngValue]="null" disabled>Selecciona una colección</option>
                @for (col of colecciones(); track col.id) {
                  <option [ngValue]="col.id">{{ col.nombre }}</option>
                }
              </select>

            </div>

          </div>
        </div>

        <div id="botones">

          <button class="botonProcesar" type="submit">
            {{ modoEdicion() ? 'EDITAR' : 'GUARDAR' }}
          </button>

          @if (modoEdicion()) {
            <button class="botonCancelar" type="button" (click)="eliminarProducto()">
              ELIMINAR
            </button>
          }

          <button class="botonCancelar" type="button" (click)="cancelar()">
            CANCELAR
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
